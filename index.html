  const row = PAY_TABLES[scale]?.[grade]
  if (!row) return null
  return row[yosIndex] ?? null
}

function loadBudget() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
    if (raw) {
      const parsed = JSON.parse(raw)
      // Fill in any newly-added sections (like investments) for budgets saved before that feature existed
      if (!parsed.investments) parsed.investments = JSON.parse(JSON.stringify(DEFAULT_BUDGET.investments))
      return parsed
    }
  } catch (e) { console.error('Could not load saved budget:', e) }
  return JSON.parse(JSON.stringify(DEFAULT_BUDGET))
}

function saveBudget(next) {
  currentData = next
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)) }
  catch (e) { console.error('Could not save:', e); alert('Could not save your changes: ' + e.message) }
  renderBudget()
}

let currentData = loadBudget()
let pieChart = null

renderBudget()

function renderBudget() {
  const d = currentData
  const totalIncome = d.income.reduce((s, i) => s + Number(i.amount || 0), 0)
  const totalExpenses = d.expenses.reduce((s, e) => s + Number(e.amount || 0), 0)
  const totalSavings = d.goals.reduce((s, g) => s + Number(g.monthly || 0), 0)
  const totalInvestMonthly = d.investments.reduce((s, i) => s + Number(i.monthly || 0), 0)
  const totalInvestBalance = d.investments.reduce((s, i) => s + Number(i.balance || 0), 0)
  const leftover = totalIncome - totalExpenses - totalSavings - totalInvestMonthly

  root.innerHTML = `
    <div class="min-h-screen bg-gray-950 pb-16">
      <header class="bg-army-green text-white px-4 py-4 sticky top-0 z-10 shadow">

          ${summaryCard('Savings Goals', totalSavings, 'text-blue-400')}
          ${summaryCard('Investing / mo', totalInvestMonthly, 'text-purple-400')}
          ${summaryCard('Portfolio Value', totalInvestBalance, 'text-indigo-400')}
          ${summaryCard(leftover >= 0 ? 'Left Over' : 'Short By', Math.abs(leftover), leftover >= 0 ? 'text-green-400' : 'text-red-400')}
        </div>
        ${payEstimatorSection(d)}
        ${listSection('income', 'Household Income', "Base pay, BAH, BAS, your trucking income, side income, etc.", d.income, [
          { key: 'name', type: 'text', placeholder: 'Source', wide: true },
          { key: 'amount', type: 'number', placeholder: 'Amount' },

        ${listSection('expenses', 'Monthly Expenses', 'Everything the household spends money on each month.', d.expenses, [

          { key: 'category', type: 'select', options: EXPENSE_CATEGORIES },
          { key: 'amount', type: 'number', placeholder: 'Amount' },

        </section>
        ${goalsSection(d)}
        ${investmentsSection(d)}
        <p class="text-center text-xs text-gray-500">
          This budget is saved only in this browser on this device. Clearing your browser data will erase it —
          consider exporting/screenshotting it occasionally.
        </p>
      </main>
    </div>`

  wirePayEstimator(d)
  wireList('income', d.income, (items) => saveBudget({ ...d, income: items }), () => ({ id: uid8(), name: '', amount: 0 }))
  wireList('expenses', d.expenses, (items) => saveBudget({ ...d, expenses: items }), () => ({ id: uid8(), name: '', category: 'Other', amount: 0 }))
  wireGoals(d)
  wireInvestments(d)
  drawChart(d.expenses)
}

}

function wirePayEstimator(d) {
  const scaleEl = document.getElementById('pe-scale')
  const gradeEl = document.getElementById('pe-grade')
  const yosEl = document.getElementById('pe-yos')
  const basePayEl = document.getElementById('pe-basepay')
  const applyBtn = document.getElementById('pe-apply')

  const refreshGrades = () => {
    const grades = Object.keys(PAY_TABLES[scaleEl.value])
    gradeEl.innerHTML = grades.map((g) => `<option value="${g}">${g}${g === 'O-3' ? ' (Captain)' : ''}</option>`).join('')
  }
  const refreshBasePay = () => {
    const bp = getMonthlyBasePay(scaleEl.value, gradeEl.value, Number(yosEl.value))
    basePayEl.textContent = bp ? money(bp) : 'N/A at this YOS'
    applyBtn.disabled = !bp
    return bp
  }

  scaleEl.onchange = () => { refreshGrades(); refreshBasePay() }
  gradeEl.onchange = refreshBasePay
  yosEl.onchange = refreshBasePay

  applyBtn.onclick = () => {
    const bp = refreshBasePay()
    if (!bp) return
    const grade = gradeEl.value
    const scale = scaleEl.value
    const bas = scale === 'enlisted' ? BAS_2026.enlisted : BAS_2026.officer
    let income = d.income.map((i) => i.name.startsWith('Base Pay') ? { ...i, name: `Base Pay (${grade})`, amount: bp } : i)
    if (!income.some((i) => i.name.startsWith('Base Pay'))) income = [{ id: uid8(), name: `Base Pay (${grade})`, amount: bp }, ...income]
    const basIdx = income.findIndex((i) => i.name === 'BAS')
    if (basIdx >= 0) income[basIdx].amount = bas
    saveBudget({ ...d, income, payProfile: { scale, grade, yosIndex: Number(yosEl.value) } })
  }
}

function listSection(id, title, subtitle, items, fields) {
  return `
    <section class="bg-gray-800 rounded-xl shadow p-4 border border-gray-700">
      <h2 class="font-bold text-army-gold text-lg">${title}</h2>
      <p class="text-xs text-gray-400 mb-3">${subtitle}</p>
      <div id="${id}-list" class="space-y-2">
        ${items.map((it) => listRow(id, it, fields)).join('')}
      </div>
      <button id="${id}-add" class="text-army-gold text-sm font-semibold underline mt-2">+ Add ${id === 'income' ? 'income source' : 'expense'}</button>
    </section>`
}

function listRow(sectionId, item, fields) {
  return `
    <div class="flex flex-wrap items-center gap-2 bg-gray-700/60 rounded-lg p-2" data-row="${item.id}">
      ${fields.map((f) => {
        if (f.type === 'select') {
          return `<select data-field="${f.key}" class="border border-gray-600 bg-gray-700 text-white rounded px-2 py-1 text-sm flex-1 min-w-[100px]">
            ${f.options.map((o) => `<option value="${o}" ${item[f.key] === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>`
        }
        const val = item[f.key] ?? ''
        return `<input data-field="${f.key}" class="border border-gray-600 bg-gray-700 text-white placeholder-gray-400 rounded px-2 py-1 text-sm ${f.wide ? 'flex-1 min-w-[120px]' : 'w-24'}" type="${f.type}" placeholder="${f.placeholder}" value="${val}" />`
      }).join('')}
      <button data-remove class="text-red-500 text-sm font-bold px-2">✕</button>
    </div>`
}

function wireList(sectionId, items, onChange, makeNew) {
  const listEl = document.getElementById(`${sectionId}-list`)
  const addBtn = document.getElementById(`${sectionId}-add`)

  listEl.querySelectorAll('[data-row]').forEach((row) => {
    const rowId = row.dataset.row
    row.querySelectorAll('[data-field]').forEach((input) => {
      input.addEventListener('change', () => {
        const key = input.dataset.field
        const value = input.type === 'number' ? Number(input.value) : input.value
        const next = items.map((it) => it.id === rowId ? { ...it, [key]: value } : it)
        onChange(next)
      })
    })
    row.querySelector('[data-remove]').addEventListener('click', () => {
      onChange(items.filter((it) => it.id !== rowId))
    })
  })

  addBtn.onclick = () => onChange([...items, makeNew()])
}

function goalsSection(d) {
  const fields = [
    { key: 'name', type: 'text', placeholder: 'Goal', wide: true },
    { key: 'target', type: 'number', placeholder: 'Target' },
    { key: 'current', type: 'number', placeholder: 'Saved so far' },
    { key: 'monthly', type: 'number', placeholder: 'Monthly $' },
  ]
  return `
    <section class="bg-gray-800 rounded-xl shadow p-4 border border-gray-700">
      <h2 class="font-bold text-army-gold text-lg">Savings Goals</h2>
      <p class="text-xs text-gray-400 mb-3">Emergency fund, house down payment, PCS cushion, vacation, etc.</p>
      <div id="goals-list" class="space-y-2">
        ${d.goals.map((g) => listRow('goals', g, fields)).join('')}
      </div>
      <button id="goals-add" class="text-army-gold text-sm font-semibold underline mt-2">+ Add goal</button>
      <div id="goals-bars" class="mt-3 space-y-2">
        ${d.goals.map((g) => goalBar(g)).join('')}
      </div>
    </section>`
}

function goalBar(g) {
  const pct = g.target > 0 ? Math.min(100, (g.current / g.target) * 100) : 0
  return `
    <div>
      <div class="flex justify-between text-xs text-gray-300">
        <span>${g.name || 'Goal'}</span><span>${money(g.current)} / ${money(g.target)}</span>
      </div>
      <div class="w-full bg-gray-700 rounded-full h-2"><div class="bg-army-gold h-2 rounded-full" style="width:${pct}%"></div></div>
    </div>`
}

function wireGoals(d) {
  wireList('goals', d.goals, (items) => saveBudget({ ...d, goals: items }), () => ({ id: uid8(), name: '', target: 0, current: 0, monthly: 0 }))
}

function investmentsSection(d) {
  const fields = [
    { key: 'name', type: 'text', placeholder: 'Account name', wide: true },
    { key: 'type', type: 'select', options: INVESTMENT_TYPES },
    { key: 'balance', type: 'number', placeholder: 'Current balance' },
    { key: 'monthly', type: 'number', placeholder: 'Monthly $' },
  ]
  const totalBalance = d.investments.reduce((s, i) => s + Number(i.balance || 0), 0)
  const totalMonthly = d.investments.reduce((s, i) => s + Number(i.monthly || 0), 0)
  return `
    <section class="bg-gray-800 rounded-xl shadow p-4 border border-gray-700">
      <h2 class="font-bold text-army-gold text-lg">Investments</h2>
      <p class="text-xs text-gray-400 mb-3">TSP, IRAs, brokerage accounts, 529s — track balances and what you're contributing each month.</p>
      <div id="investments-list" class="space-y-2">
        ${d.investments.map((it) => listRow('investments', it, fields)).join('')}
      </div>
      <button id="investments-add" class="text-army-gold text-sm font-semibold underline mt-2">+ Add investment account</button>
      <div class="flex justify-between text-sm font-semibold text-army-gold mt-3 bg-gray-700 rounded-lg p-2">
        <span>Total portfolio: ${money(totalBalance)}</span>
        <span>Contributing: ${money(totalMonthly)}/mo</span>
      </div>
    </section>`
}

function wireInvestments(d) {
  wireList('investments', d.investments, (items) => saveBudget({ ...d, investments: items }), () => ({ id: uid8(), name: '', type: 'TSP (Thrift Savings Plan)', balance: 0, monthly: 0 }))
}

function drawChart(expenses) {
  const map = {}
  expenses.forEach((e) => { map[e.category || 'Other'] = (map[e.category || 'Other'] || 0) + Number(e.amount || 0) })
  const labels = Object.keys(map)
  const values = Object.values(map)
  const ctx = document.getElementById('expense-chart')
  if (pieChart) pieChart.destroy()
  if (!labels.length || values.every((v) => v === 0)) {
    ctx.getContext('2d').clearRect(0, 0, ctx.width, ctx.height)
    return
  }
  pieChart = new Chart(ctx, {
    type: 'pie',
    data: { labels, datasets: [{ data: values, backgroundColor: COLORS }] },
    options: { plugins: { legend: { position: 'bottom' } } },
  })
}
  </script>
