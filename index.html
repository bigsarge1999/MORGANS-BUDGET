function getMonthlyBasePay(scale, grade, yosIndex) {
  const row = PAY_TABLES[scale]?.[grade]
  if (!row) return null
  return row[yosIndex] ?? null
}

function loadBudget() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
    if (raw) return JSON.parse(raw)
  } catch (e) { console.error('Could not load saved budget:', e) }
  return JSON.parse(JSON.stringify(DEFAULT_BUDGET))
}

function saveBudget(next) {
  currentData = next
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)) }
  catch (e) { console.error('Could not save:', e); alert('Could not save your changes: ' + e.message) }
  renderBudget()
}

let currentData = loadBudget()
let pieChart = null

renderBudget()

function renderBudget() {
  const d = currentData
  const totalIncome = d.income.reduce((s, i) => s + Number(i.amount || 0), 0)
  const totalExpenses = d.expenses.reduce((s, e) => s + Number(e.amount || 0), 0)
  const totalSavings = d.goals.reduce((s, g) => s + Number(g.monthly || 0), 0)

  root.innerHTML = `
    <div class="min-h-screen bg-zinc-950 text-zinc-100 pb-16">
      <header class="bg-zinc-900 border-b border-zinc-800 text-white px-4 py-4 sticky top-0 z-10 shadow-lg">

          ${summaryCard('Total Income', totalIncome, 'text-emerald-400')}
          ${summaryCard('Total Expenses', totalExpenses, 'text-amber-400')}
          ${summaryCard('Savings Goals', totalSavings, 'text-cyan-400')}
          ${summaryCard(leftover >= 0 ? 'Left Over' : 'Short By', Math.abs(leftover), leftover >= 0 ? 'text-emerald-400' : 'text-rose-500')}
        </div>
        ${payEstimatorSection(d)}
        ${listSection('income', 'Household Income', "Base pay, BAH, BAS, your trucking income, side income, etc.", d.income, [
          { key: 'name', type: 'text', placeholder: 'Source', wide: true },
          { key: 'amount', type: 'number', placeholder: 'Amount' },
        ])}
        ${listSection('expenses', 'Monthly Expenses', 'Everything the household spends money on each month.', d.expenses, [
          { key: 'name', type: 'text', placeholder: 'Expense', wide: true },
          { key: 'category', type: 'select', options: EXPENSE_CATEGORIES },
          { key: 'amount', type: 'number', placeholder: 'Amount' },
        ])}
        <section class="bg-zinc-900 border border-zinc-800 rounded-xl shadow-md p-4">
          <h2 class="font-bold text-zinc-200 text-lg mb-2">Expense Breakdown</h2>
          <canvas id="expense-chart" height="220"></canvas>
        </section>
        ${goalsSection(d)}
        <p class="text-center text-xs text-zinc-500">
          This budget is saved only in this browser on this device. Clearing your browser data will erase it —
          consider exporting/screenshotting it occasionally.
        </p>
      </main>
    </div>`

  wirePayEstimator(d)
  wireList('income', d.income, (items) => saveBudget({ ...d, income: items }), () => ({ id: uid8(), name: '', amount: 0 }))
  wireList('expenses', d.expenses, (items) => saveBudget({ ...d, expenses: items }), () => ({ id: uid8(), name: '', category: 'Other', amount: 0 }))
  wireGoals(d)
  drawChart(d.expenses)
}

}

      <h2 class="font-bold text-army-gold text-lg">2026 Military Pay Chart</h2>
      <p class="text-xs text-zinc-400 mb-3">Official DFAS basic pay, effective Jan 1, 2026 (+3.8% raise). Pick rank and years of service.</p>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

            <option value="officerPriorEnlisted" ${profile.scale === 'officerPriorEnlisted' ? 'selected' : ''}>Prior-Enlisted Officer (O-1E to O-3E)</option>

        </label>

            ${grades.map((g) => `<option value="${g}" ${g === profile.grade ? 'selected' : ''}>${g}${g === 'O-3' ? ' (Captain)' : ''}</option>`).join('')}
          </select>
        </label>
        <label class="text-sm">
          <span class="block text-zinc-400 mb-1">Years of Service</span>
          <select id="pe-yos" class="w-full bg-zinc-800 border border-zinc-700 text-zinc-100 rounded-lg px-2.5 py-2 focus:outline-none focus:border-army-gold">
            ${YOS_COLUMNS.map((y, idx) => `<option value="${idx}" ${idx === profile.yosIndex ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
        </label>
      </div>
      <div class="flex items-center justify-between bg-zinc-950/80 border border-zinc-800 rounded-lg p-3 mt-4">
        <div>
          <p class="text-xs text-zinc-400">Monthly Base Pay</p>
          <p id="pe-basepay" class="text-xl font-bold text-emerald-400">${basePay ? money(basePay) : 'N/A at this YOS'}</p>
        </div>
        <button id="pe-apply" class="bg-army-olive hover:bg-opacity-80 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors disabled:opacity-30 disabled:hover:bg-opacity-100" ${basePay ? '' : 'disabled'}>Apply to Income</button>
      </div>
      <p class="text-xs text-zinc-500 mt-3">${BAH_NOTE}</p>
    </section>`
}

function wirePayEstimator(d) {
  const scaleEl = document.getElementById('pe-scale')
  const gradeEl = document.getElementById('pe-grade')
  const yosEl = document.getElementById('pe-yos')
  const basePayEl = document.getElementById('pe-basepay')
  const applyBtn = document.getElementById('pe-apply')

  const refreshGrades = () => {
    const grades = Object.keys(PAY_TABLES[scaleEl.value])
    gradeEl.innerHTML = grades.map((g) => `<option value="${g}">${g}${g === 'O-3' ? ' (Captain)' : ''}</option>`).join('')
  }
  const refreshBasePay = () => {
    const bp = getMonthlyBasePay(scaleEl.value, gradeEl.value, Number(yosEl.value))
    basePayEl.textContent = bp ? money(bp) : 'N/A at this YOS'
    applyBtn.disabled = !bp
    return bp
  }

  scaleEl.onchange = () => { refreshGrades(); refreshBasePay() }
  gradeEl.onchange = refreshBasePay
  yosEl.onchange = refreshBasePay

  applyBtn.onclick = () => {
    const bp = refreshBasePay()
    if (!bp) return
    const grade = gradeEl.value
    const scale = scaleEl.value
    const bas = scale === 'enlisted' ? BAS_2026.enlisted : BAS_2026.officer
    let income = d.income.map((i) => i.name.startsWith('Base Pay') ? { ...i, name: `Base Pay (${grade})`, amount: bp } : i)
    if (!income.some((i) => i.name.startsWith('Base Pay'))) income = [{ id: uid8(), name: `Base Pay (${grade})`, amount: bp }, ...income]
    const basIdx = income.findIndex((i) => i.name === 'BAS')
    if (basIdx >= 0) income[basIdx].amount = bas
    saveBudget({ ...d, income, payProfile: { scale, grade, yosIndex: Number(yosEl.value) } })
  }
}

function listSection(id, title, subtitle, items, fields) {
  return `
    <section class="bg-zinc-900 border border-zinc-800 rounded-xl shadow-md p-4">
      <h2 class="font-bold text-army-gold text-lg">${title}</h2>
      <p class="text-xs text-zinc-400 mb-3">${subtitle}</p>
      <div id="${id}-list" class="space-y-2">
        ${items.map((it) => listRow(id, it, fields)).join('')}
      </div>
      <button id="${id}-add" class="text-amber-400 hover:text-amber-300 text-sm font-semibold underline mt-3 inline-block transition-colors">+ Add ${id === 'income' ? 'income source' : 'expense'}</button>
    </section>`
}

function listRow(sectionId, item, fields) {
  return `
    <div class="flex flex-wrap items-center gap-2 bg-zinc-800/60 border border-zinc-700/50 rounded-lg p-2" data-row="${item.id}">
      ${fields.map((f) => {
        if (f.type === 'select') {
          return `<select data-field="${f.key}" class="bg-zinc-900 border border-zinc-700 text-zinc-100 rounded px-2 py-1.5 text-sm flex-1 min-w-[100px] focus:outline-none focus:border-army-gold">
            ${f.options.map((o) => `<option value="${o}" ${item[f.key] === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>`
        }
        const val = item[f.key] ?? ''
        return `<input data-field="${f.key}" class="bg-zinc-900 border border-zinc-700 text-zinc-100 placeholder-zinc-500 rounded px-2 py-1.5 text-sm ${f.wide ? 'flex-1 min-w-[120px]' : 'w-24'} focus:outline-none focus:border-army-gold" type="${f.type}" placeholder="${f.placeholder}" value="${val}" />`
      }).join('')}
      <button data-remove class="text-rose-400 hover:text-rose-300 text-sm font-bold px-2 py-1 rounded transition-colors">✕</button>
    </div>`
}

function wireList(sectionId, items, onChange, makeNew) {
  const listEl = document.getElementById(`${sectionId}-list`)
  const addBtn = document.getElementById(`${sectionId}-add`)

  listEl.querySelectorAll('[data-row]').forEach((row) => {
    const rowId = row.dataset.row
    row.querySelectorAll('[data-field]').forEach((input) => {
      input.addEventListener('change', () => {
        const key = input.dataset.field
        const value = input.type === 'number' ? Number(input.value) : input.value
        const next = items.map((it) => it.id === rowId ? { ...it, [key]: value } : it)
        onChange(next)
      })
    })
    row.querySelector('[data-remove]').addEventListener('click', () => {
      onChange(items.filter((it) => it.id !== rowId))
    })
  })

  addBtn.onclick = () => onChange([...items, makeNew()])
}

function goalsSection(d) {
  const fields = [
    { key: 'name', type: 'text', placeholder: 'Goal', wide: true },
    { key: 'target', type: 'number', placeholder: 'Target' },
    { key: 'current', type: 'number', placeholder: 'Saved so far' },
    { key: 'monthly', type: 'number', placeholder: 'Monthly $' },
  ]
  return `
    <section class="bg-zinc-900 border border-zinc-800 rounded-xl shadow-md p-4">
      <h2 class="font-bold text-army-gold text-lg">Savings Goals</h2>
      <p class="text-xs text-zinc-400 mb-3">Emergency fund, house down payment, PCS cushion, vacation, etc.</p>
      <div id="goals-list" class="space-y-2">
        ${d.goals.map((g) => listRow('goals', g, fields)).join('')}
      </div>
      <button id="goals-add" class="text-amber-400 hover:text-amber-300 text-sm font-semibold underline mt-3 inline-block transition-colors">+ Add goal</button>
      <div id="goals-bars" class="mt-4 space-y-3">
        ${d.goals.map((g) => goalBar(g)).join('')}
      </div>
    </section>`
}

function goalBar(g) {
  const pct = g.target > 0 ? Math.min(100, (g.current / g.target) * 100) : 0
  return `
    <div>
      <div class="flex justify-between text-xs text-zinc-300 mb-1">
        <span class="font-medium">${g.name || 'Goal'}</span>
        <span class="text-zinc-400">${money(g.current)} / ${money(g.target)}</span>
      </div>
      <div class="w-full bg-zinc-800 rounded-full h-2 overflow-hidden border border-zinc-700/50">
        <div class="bg-army-gold h-2 rounded-full transition-all duration-300" style="width:${pct}%"></div>
      </div>
    </div>`
}

function wireGoals(d) {
  wireList('goals', d.goals, (items) => saveBudget({ ...d, goals: items }), () => ({ id: uid8(), name: '', target: 0, current: 0, monthly: 0 }))
}

function drawChart(expenses) {
  const map = {}
  expenses.forEach((e) => { map[e.category || 'Other'] = (map[e.category || 'Other'] || 0) + Number(e.amount || 0) })
  const labels = Object.keys(map)
  const values = Object.values(map)
  const ctx = document.getElementById('expense-chart')
  if (pieChart) pieChart.destroy()
  if (!labels.length || values.every((v) => v === 0)) {
    ctx.getContext('2d').clearRect(0, 0, ctx.width, ctx.height)
    return
  }
  pieChart = new Chart(ctx, {
    type: 'pie',
    data: { 
      labels, 
      datasets: [{ 
        data: values, 
        backgroundColor: COLORS,
        borderColor: '#18181b',
        borderWidth: 2
      }] 
    },
    options: { 
      plugins: { 
        legend: { 
          position: 'bottom',
          labels: {
            color: '#a1a1aa'
          }
        } 
      } 
    },
  })
}
  </script>
</body>
