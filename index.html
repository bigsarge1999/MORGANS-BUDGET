export function getMonthlyBasePay(scale, grade, yosIndex) {
  const row = PAY_TABLES[scale]?.[grade]
  if (!row) return null
  return row[yosIndex] ?? null
}

let currentUser = null
let currentData = null
let unsubscribeSnapshot = null
let pieChart = null

// ---------- boot ----------
onAuthStateChanged(auth, (user) => {
  currentUser = user
  if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null }
  if (user) startBudgetListener(user)
  else renderAuthScreen()
})

function startBudgetListener(user) {
  const ref = doc(db, 'budgets', user.uid)
  unsubscribeSnapshot = onSnapshot(ref, (snap) => {
    if (snap.exists()) currentData = snap.data()
    else { currentData = DEFAULT_BUDGET; setDoc(ref, DEFAULT_BUDGET) }
    renderBudget()
  }, (err) => {
    root.innerHTML = `<div class="p-6 text-red-600">Error loading your budget: ${err.message}</div>`
  })
}

async function saveBudget(next) {
  currentData = next
  renderBudget()
  try { await setDoc(doc(db, 'budgets', currentUser.uid), next) }
  catch (err) { console.error(err); alert('Could not save: ' + err.message) }
}

// ---------- auth screen ----------
function renderAuthScreen() {
  root.innerHTML = `
    <div class="min-h-screen bg-army-tan flex items-center justify-center p-4">
      <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-sm border-t-4 border-army-gold">
        <h1 class="text-2xl font-bold text-army-green mb-1">Family Mission Budget</h1>
        <p class="text-sm text-gray-500 mb-6">Sign in to sync your budget across devices.</p>
        <form id="auth-form" class="space-y-3">
          <input id="auth-email" class="w-full border rounded-lg px-3 py-2" type="email" placeholder="Email" required />
          <input id="auth-password" class="w-full border rounded-lg px-3 py-2" type="password" placeholder="Password (6+ characters)" required minlength="6" />
          <p id="auth-error" class="text-red-600 text-sm hidden"></p>
          <button id="auth-submit" type="submit" class="w-full bg-army-olive text-white rounded-lg py-2 font-semibold hover:opacity-90">Sign In</button>
        </form>
        <button id="auth-toggle" class="text-sm text-army-olive underline mt-4">Need an account? Sign up</button>
      </div>
    </div>`

  let mode = 'signin'
  const form = document.getElementById('auth-form')
  const errEl = document.getElementById('auth-error')
  const submitBtn = document.getElementById('auth-submit')
  const toggleBtn = document.getElementById('auth-toggle')

  toggleBtn.onclick = () => {
    mode = mode === 'signin' ? 'signup' : 'signin'
    submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account'
    toggleBtn.textContent = mode === 'signin' ? 'Need an account? Sign up' : 'Already have an account? Sign in'
  }

  form.onsubmit = async (e) => {
    e.preventDefault()
    errEl.classList.add('hidden')
    submitBtn.disabled = true
    submitBtn.textContent = 'Please wait...'
    const email = document.getElementById('auth-email').value
    const password = document.getElementById('auth-password').value
    try {
      if (mode === 'signin') await signInWithEmailAndPassword(auth, email, password)
      else await createUserWithEmailAndPassword(auth, email, password)
    } catch (err) {
      errEl.textContent = err.message.replace('Firebase: ', '')
      errEl.classList.remove('hidden')
      submitBtn.disabled = false
      submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account'
    }
  }
}

// ---------- budget dashboard ----------
function renderBudget() {
  const d = currentData
  const totalIncome = d.income.reduce((s, i) => s + Number(i.amount || 0), 0)
  const totalExpenses = d.expenses.reduce((s, e) => s + Number(e.amount || 0), 0)
  const totalSavings = d.goals.reduce((s, g) => s + Number(g.monthly || 0), 0)
  const leftover = totalIncome - totalExpenses - totalSavings

  root.innerHTML = `
    <div class="min-h-screen bg-army-tan pb-16">
      <header class="bg-army-green text-white px-4 py-4 flex items-center justify-between sticky top-0 z-10 shadow">
        <div>
          <h1 class="text-lg font-bold tracking-wide">FAMILY MISSION BUDGET</h1>
          <p class="text-xs text-army-tan/70">${currentUser.email}</p>
        </div>
        <button id="signout-btn" class="text-sm bg-army-gold text-army-green px-3 py-1.5 rounded-lg font-semibold">Sign Out</button>
      </header>
      <main class="max-w-3xl mx-auto p-4 space-y-6">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          ${summaryCard('Total Income', totalIncome, 'text-army-olive')}
          ${summaryCard('Total Expenses', totalExpenses, 'text-army-gold')}
          ${summaryCard('Savings Goals', totalSavings, 'text-blue-700')}
          ${summaryCard(leftover >= 0 ? 'Left Over' : 'Short By', Math.abs(leftover), leftover >= 0 ? 'text-green-700' : 'text-red-600')}
        </div>
        ${payEstimatorSection(d)}
        ${listSection('income', 'Household Income', "Base pay, BAH, BAS, your trucking income, side income, etc.", d.income, [
          { key: 'name', type: 'text', placeholder: 'Source', wide: true },
          { key: 'amount', type: 'number', placeholder: 'Amount' },
        ])}
        ${listSection('expenses', 'Monthly Expenses', 'Everything the household spends money on each month.', d.expenses, [
          { key: 'name', type: 'text', placeholder: 'Expense', wide: true },
          { key: 'category', type: 'select', options: EXPENSE_CATEGORIES },
          { key: 'amount', type: 'number', placeholder: 'Amount' },
        ])}
        <section class="bg-white rounded-xl shadow p-4">
          <canvas id="expense-chart" height="220"></canvas>
        </section>
        ${goalsSection(d)}
      </main>
    </div>`

  document.getElementById('signout-btn').onclick = () => signOut(auth)
  wirePayEstimator(d)
  wireList('income', d.income, (items) => saveBudget({ ...d, income: items }), () => ({ id: uid8(), name: '', amount: 0 }))
  wireList('expenses', d.expenses, (items) => saveBudget({ ...d, expenses: items }), () => ({ id: uid8(), name: '', category: 'Other', amount: 0 }))
  wireGoals(d)
  drawChart(d.expenses)
}

function summaryCard(label, value, colorClass) {
  return `
    <div class="bg-white rounded-xl shadow p-4 text-center">
      <p class="text-xs uppercase text-gray-500 font-semibold">${label}</p>
      <p class="text-xl font-bold ${colorClass}">${money(value)}</p>
    </div>`
}

// ---------- pay estimator ----------
function payEstimatorSection(d) {
  const profile = d.payProfile || DEFAULT_BUDGET.payProfile
  const grades = Object.keys(PAY_TABLES[profile.scale])
  const basePay = getMonthlyBasePay(profile.scale, profile.grade, profile.yosIndex)
  return `
    <section class="bg-white rounded-xl shadow p-4">
      <h2 class="font-bold text-army-green text-lg">2026 Military Pay Chart</h2>
      <p class="text-xs text-gray-500 mb-3">Official DFAS basic pay, effective Jan 1, 2026 (+3.8% raise). Pick rank and years of service.</p>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <label class="text-sm">
          <span class="block text-gray-500 mb-1">Pay Scale</span>
          <select id="pe-scale" class="w-full border rounded-lg px-2 py-2">
            <option value="officer" ${profile.scale === 'officer' ? 'selected' : ''}>Officer (O-1 to O-10)</option>
            <option value="officerPriorEnlisted" ${profile.scale === 'officerPriorEnlisted' ? 'selected' : ''}>Prior-Enlisted Officer (O-1E to O-3E)</option>
            <option value="warrant" ${profile.scale === 'warrant' ? 'selected' : ''}>Warrant Officer (W-1 to W-5)</option>
            <option value="enlisted" ${profile.scale === 'enlisted' ? 'selected' : ''}>Enlisted (E-1 to E-9)</option>
          </select>
        </label>
        <label class="text-sm">
          <span class="block text-gray-500 mb-1">Rank / Grade</span>
          <select id="pe-grade" class="w-full border rounded-lg px-2 py-2">
            ${grades.map((g) => `<option value="${g}" ${g === profile.grade ? 'selected' : ''}>${g}${g === 'O-3' ? ' (Captain)' : ''}</option>`).join('')}
          </select>
        </label>
        <label class="text-sm">
          <span class="block text-gray-500 mb-1">Years of Service</span>
          <select id="pe-yos" class="w-full border rounded-lg px-2 py-2">
            ${YOS_COLUMNS.map((y, idx) => `<option value="${idx}" ${idx === profile.yosIndex ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
        </label>
      </div>
      <div class="flex items-center justify-between bg-army-tan rounded-lg p-3 mt-3">
        <div>
          <p class="text-xs text-gray-600">Monthly Base Pay</p>
          <p id="pe-basepay" class="text-xl font-bold text-army-green">${basePay ? money(basePay) : 'N/A at this YOS'}</p>
        </div>
        <button id="pe-apply" class="bg-army-olive text-white px-4 py-2 rounded-lg text-sm font-semibold disabled:opacity-40" ${basePay ? '' : 'disabled'}>Apply to Income</button>
      </div>
      <p class="text-xs text-gray-500 mt-2">${BAH_NOTE}</p>
    </section>`
}

function wirePayEstimator(d) {
  const scaleEl = document.getElementById('pe-scale')
  const gradeEl = document.getElementById('pe-grade')
  const yosEl = document.getElementById('pe-yos')
  const basePayEl = document.getElementById('pe-basepay')
  const applyBtn = document.getElementById('pe-apply')

  const refreshGrades = () => {
    const grades = Object.keys(PAY_TABLES[scaleEl.value])
    gradeEl.innerHTML = grades.map((g) => `<option value="${g}">${g}${g === 'O-3' ? ' (Captain)' : ''}</option>`).join('')
  }
  const refreshBasePay = () => {
    const bp = getMonthlyBasePay(scaleEl.value, gradeEl.value, Number(yosEl.value))
    basePayEl.textContent = bp ? money(bp) : 'N/A at this YOS'
    applyBtn.disabled = !bp
    return bp
  }

  scaleEl.onchange = () => { refreshGrades(); refreshBasePay() }
  gradeEl.onchange = refreshBasePay
  yosEl.onchange = refreshBasePay

  applyBtn.onclick = () => {
    const bp = refreshBasePay()
    if (!bp) return
    const grade = gradeEl.value
    const scale = scaleEl.value
    const bas = scale === 'enlisted' ? BAS_2026.enlisted : BAS_2026.officer
    let income = d.income.map((i) => i.name.startsWith('Base Pay') ? { ...i, name: `Base Pay (${grade})`, amount: bp } : i)
    if (!income.some((i) => i.name.startsWith('Base Pay'))) income = [{ id: uid8(), name: `Base Pay (${grade})`, amount: bp }, ...income]
    const basIdx = income.findIndex((i) => i.name === 'BAS')
    if (basIdx >= 0) income[basIdx].amount = bas
    saveBudget({ ...d, income, payProfile: { scale, grade, yosIndex: Number(yosEl.value) } })
  }
}

// ---------- generic editable list (income / expenses) ----------
function listSection(id, title, subtitle, items, fields) {
  return `
    <section class="bg-white rounded-xl shadow p-4">
      <h2 class="font-bold text-army-green text-lg">${title}</h2>
      <p class="text-xs text-gray-500 mb-3">${subtitle}</p>
      <div id="${id}-list" class="space-y-2">
        ${items.map((it) => listRow(id, it, fields)).join('')}
      </div>
      <button id="${id}-add" class="text-army-olive text-sm font-semibold underline mt-2">+ Add ${id === 'income' ? 'income source' : 'expense'}</button>
    </section>`
}

function listRow(sectionId, item, fields) {
  return `
    <div class="flex flex-wrap items-center gap-2 bg-army-tan/50 rounded-lg p-2" data-row="${item.id}">
      ${fields.map((f) => {
        if (f.type === 'select') {
          return `<select data-field="${f.key}" class="border rounded px-2 py-1 text-sm flex-1 min-w-[100px]">
            ${f.options.map((o) => `<option value="${o}" ${item[f.key] === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>`
        }
        const val = item[f.key] ?? ''
        return `<input data-field="${f.key}" class="border rounded px-2 py-1 text-sm ${f.wide ? 'flex-1 min-w-[120px]' : 'w-24'}" type="${f.type}" placeholder="${f.placeholder}" value="${val}" />`
      }).join('')}
      <button data-remove class="text-red-500 text-sm font-bold px-2">✕</button>
    </div>`
}

function wireList(sectionId, items, onChange, makeNew) {
  const listEl = document.getElementById(`${sectionId}-list`)
  const addBtn = document.getElementById(`${sectionId}-add`)

  listEl.querySelectorAll('[data-row]').forEach((row) => {
    const rowId = row.dataset.row
    row.querySelectorAll('[data-field]').forEach((input) => {
      input.addEventListener('change', () => {
        const key = input.dataset.field
        const value = input.type === 'number' ? Number(input.value) : input.value
        const next = items.map((it) => it.id === rowId ? { ...it, [key]: value } : it)
        onChange(next)
      })
    })
    row.querySelector('[data-remove]').addEventListener('click', () => {
      onChange(items.filter((it) => it.id !== rowId))
    })
  })

  addBtn.onclick = () => onChange([...items, makeNew()])
}

// ---------- savings goals ----------
function goalsSection(d) {
  const fields = [
    { key: 'name', type: 'text', placeholder: 'Goal', wide: true },
    { key: 'target', type: 'number', placeholder: 'Target' },
    { key: 'current', type: 'number', placeholder: 'Saved so far' },
    { key: 'monthly', type: 'number', placeholder: 'Monthly $' },
  ]
  return `
    <section class="bg-white rounded-xl shadow p-4">
      <h2 class="font-bold text-army-green text-lg">Savings Goals</h2>
      <p class="text-xs text-gray-500 mb-3">Emergency fund, house down payment, PCS cushion, vacation, etc.</p>
      <div id="goals-list" class="space-y-2">
        ${d.goals.map((g) => listRow('goals', g, fields)).join('')}
      </div>
      <button id="goals-add" class="text-army-olive text-sm font-semibold underline mt-2">+ Add goal</button>
      <div id="goals-bars" class="mt-3 space-y-2">
        ${d.goals.map((g) => goalBar(g)).join('')}
      </div>
    </section>`
}

function goalBar(g) {
  const pct = g.target > 0 ? Math.min(100, (g.current / g.target) * 100) : 0
  return `
    <div>
      <div class="flex justify-between text-xs text-gray-600">
        <span>${g.name || 'Goal'}</span><span>${money(g.current)} / ${money(g.target)}</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2"><div class="bg-army-gold h-2 rounded-full" style="width:${pct}%"></div></div>
    </div>`
}

function wireGoals(d) {
  wireList('goals', d.goals, (items) => saveBudget({ ...d, goals: items }), () => ({ id: uid8(), name: '', target: 0, current: 0, monthly: 0 }))
}

// ---------- chart ----------
function drawChart(expenses) {
  const map = {}
  expenses.forEach((e) => { map[e.category || 'Other'] = (map[e.category || 'Other'] || 0) + Number(e.amount || 0) })
  const labels = Object.keys(map)
  const values = Object.values(map)
  const ctx = document.getElementById('expense-chart')
  if (pieChart) pieChart.destroy()
  if (!labels.length || values.every((v) => v === 0)) {
    ctx.getContext('2d').clearRect(0, 0, ctx.width, ctx.height)
    return
  }
  pieChart = new Chart(ctx, {
    type: 'pie',
    data: { labels, datasets: [{ data: values, backgroundColor: COLORS }] },
    options: { plugins: { legend: { position: 'bottom' } } },
  })
}
